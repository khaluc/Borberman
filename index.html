<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bomberland Arena</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="game-shell"><header><div class="brand"><span class="brand-bomb">●</span> BOMBERLAND</div><div class="live"><i></i> 3 STRATEGIES</div></header>
<section class="scorebar"><div><small>STEP</small><strong id="score">0000</strong></div><div class="lives" id="aliveAgents"><span>●</span><span>●</span><span>●</span></div><div><small>MODE</small><strong>AI</strong></div></section>
<div class="board-wrap"><div id="gameBoard" class="board"></div><div id="gameOverlay" class="overlay"><span>LOCAL CHALLENGE</span><h1>AGENTS<br><em>READY</em></h1><button id="startButton">RUN MATCH <b>→</b></button></div></div>
<footer><div class="status-box"><small>ENGINE</small><strong id="engineStatus">PAUSED</strong></div><div class="status-box"><small>TOP SCORE</small><strong id="topScore">000</strong></div><button id="resetButton" class="reset">↻</button></footer>
</main><script src="script.js"></script></body></html>
